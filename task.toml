[task]
name = "afterquery/lagrange-coefficient-formalization"
description = "Formalize a general barycentric coefficient identity for finite Lagrange interpolation in Lean and derive two nontrivial corollaries."
authors = [{ name = "Brian Njenga Mwaura", email = "info@brianmwaura.com" }]
keywords = ["Lean", "Mathlib", "Lagrange interpolation", "barycentric interpolation", "polynomial coefficients", "formal verification"]

[metadata]
author_name = "Brian Njenga Mwaura"
author_email = "info@brianmwaura.com"
