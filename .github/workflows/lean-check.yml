name: Kepler Verifier Check

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build solution environment
        run: |
          docker build -t lagrange-env ./environment

      - name: Generate Solution.lean
        run: |
          mkdir -p out

          docker run --rm \
            --user root \
            -v "$PWD/solution:/solution:ro" \
            -v "$PWD/out:/out" \
            lagrange-env \
            bash -lc '
              cp /solution/solve.sh /app/solve.sh
              chmod +x /app/solve.sh
              /app/solve.sh
              test -f /app/Solution.lean
              cp /app/Solution.lean /out/Solution.lean
            '

      - name: Compile generated solution
        run: |
          docker run --rm \
            --user lean \
            -v "$PWD/out/Solution.lean:/app/mathproject/Solution.lean:ro" \
            lagrange-env \
            bash -lc '
              cd /app/mathproject
              lake env lean Solution.lean
            '

      - name: Show result
        run: |
          echo "Solution.lean was generated and compiled successfully."
