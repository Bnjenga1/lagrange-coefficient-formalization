name: Kepler Full Verifier

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build solution environment
        run: |
          docker build -t lagrange-env ./environment

      - name: Build verifier environment
        run: |
          docker build -t lagrange-tests ./tests

      - name: Generate Solution.lean
        run: |
          rm -rf out logs
          mkdir -p out logs/verifier

          docker run --rm \
            --user root \
            -v "$PWD/solution:/solution:ro" \
            -v "$PWD/out:/out" \
            lagrange-env \
            bash -lc '
              cp /solution/solve.sh /app/solve.sh
              chmod +x /app/solve.sh
              /app/solve.sh
              test -f /app/Solution.lean
              cp /app/Solution.lean /out/Solution.lean
            '

      - name: Run actual Kepler verifier
        run: |
          docker run --rm \
            --user root \
            -v "$PWD/out/Solution.lean:/app/Solution.lean:ro" \
            -v "$PWD/logs/verifier:/logs/verifier" \
            lagrange-tests \
            bash -lc '
              chmod +x /tests/test.sh
              /tests/test.sh
            '

      - name: Show reward
        if: always()
        run: |
          echo "===== REWARD ====="
          cat logs/verifier/reward.txt 2>/dev/null || true

          echo "===== CTRF ====="
          cat logs/verifier/ctrf.json 2>/dev/null || true

      - name: Diagnose verifier failure
        if: always()
        run: |
          reward=$(cat logs/verifier/reward.txt 2>/dev/null || echo "missing")

          if [ "$reward" != "1" ]; then
            echo "========================================"
            echo "REWARD IS NOT 1"
            echo "Running pytest in verbose diagnostic mode"
            echo "========================================"

            docker run --rm \
              --user root \
              -v "$PWD/out/Solution.lean:/app/Solution.lean:ro" \
              -v "$PWD/logs:/logs" \
              lagrange-tests \
              bash -lc '
                mkdir -p /mathlib/Submission
                cp /app/Solution.lean /mathlib/Submission/Solution.lean
                cp /tests/Checker.lean /mathlib/Submission/Checker.lean

                cd /mathlib

                pytest -vv /tests/test_submission.py
              '
          else
            echo "========================================"
            echo "SUCCESS: VERIFIER REWARD IS 1"
            echo "========================================"
          fi

      - name: Require reward 1
        run: |
          test -f logs/verifier/reward.txt
          reward=$(cat logs/verifier/reward.txt)
          echo "Final reward: $reward"
          test "$reward" = "1"
