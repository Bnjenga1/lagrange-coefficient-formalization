name: Kepler Verifier Check

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Docker
        run: |
          docker --version
          docker build -t lagrange-env ./environment

      - name: Run solution
        run: |
          mkdir -p out

          docker run --rm \
            --user root \
            -v "$PWD/solution:/solution:ro" \
            -v "$PWD/out:/out" \
            lagrange-env \
            bash -lc '
              cp /solution/solve.sh /app/solve.sh
              chmod +x /app/solve.sh
              /app/solve.sh
              test -f /app/Solution.lean
              cp /app/Solution.lean /out/Solution.lean
            '

      - name: Show solution
        run: |
          echo "Solution generated:"
          ls -lh out/
