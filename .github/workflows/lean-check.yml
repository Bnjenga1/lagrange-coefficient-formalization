name: Lean Docker Check

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Lean environment
        run: docker build -t lagrange-env ./environment

      - name: Generate reference solution
        run: |
          mkdir -p out
          chmod 777 out
          docker run --rm \
           -v "$PWD/solution:/solution" \
           -v "$PWD/out:/out" \
           lagrange-env \
           bash -lc 'bash /solution/solve.sh && cat /app/Solution.lean > /out/Solution.lean'
      - name: Compile reference solution
        run: |
          docker run --rm \
            -v "$PWD/out:/out" \
            lagrange-env \
            bash -lc 'cd /mathlib && lake env lean -o /tmp/Solution.olean /out/Solution.lean'
